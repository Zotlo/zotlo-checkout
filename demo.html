<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/android-chrome-512x512.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/android-chrome-192x192.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Zotlo Checkout</title>
    <link href="./dist/checkout.css" rel="stylesheet">
    <link href="./dist/zotlo-checkout.css" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600&display=swap">
  </head>
  <body>
    <header id="sandbox-strip" class="sandbox">
      <style>
        .sandbox {
          display: none;
          align-items: center;
          justify-content: space-between;
          box-sizing: border-box;
          height: 40px;
          padding: 0 16px;
          margin-bottom: 16px;
          background-color: #6954d6;
          color: #fff;
          font-family: 'Outfit', system-ui, -apple-system, sans-serif;
          font-size: 14px;
          line-height: 20px;
          font-feature-settings: "liga" 0;
          position: sticky;
          top: 0;
          z-index: 19;
        }

        .sandbox-left {
          display: flex;
          align-items: center;
          gap: 12px;
          min-width: 0;
        }

        .sandbox-pill {
          display: inline-flex;
          align-items: center;
          gap: 6px;
          flex-shrink: 0;
          box-sizing: border-box;
          height: 24px;
          padding: 0 12px 0 10px;
          border: 1px solid #fff;
          border-radius: 64px;
          font-weight: 600;
        }

        .sandbox-pill svg {
          flex-shrink: 0;
        }

        .sandbox-message {
          display: flex;
          align-items: center;
          gap: 6px;
          min-width: 0;
        }

        .sandbox-text {
          font-weight: 500;
          white-space: nowrap;
        }

        .sandbox-link {
          padding: 0 2px;
          border-radius: 4px;
          color: #fff;
          font-weight: 600;
          text-decoration: underline;
          text-decoration-thickness: 1px;
          text-decoration-skip-ink: none;
          white-space: nowrap;
        }

        .sandbox-link:hover {
          color: #e1dbff;
        }

        .sandbox-link:focus-visible {
          outline: none;
          box-shadow: 0 0 0 1px #fff, 0 0 0 2px #c3b7ff;
        }

        @media screen and (max-width: 767px) {
          .sandbox-text { display: none; }
        }
      </style>
      <div class="sandbox-left">
        <span class="sandbox-pill">
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M4.66667 2.625H5.24999V6.26396C5.24999 6.48268 5.19533 6.69792 5.09098 6.89014L2.9999 10.7421C2.63065 11.4223 3.12309 12.25 3.89707 12.25H10.1029C10.8769 12.25 11.3693 11.4223 11.0001 10.7421L8.90899 6.89014C8.80464 6.69792 8.74999 6.48268 8.74999 6.26396V2.625H9.33333C9.57496 2.625 9.77083 2.42912 9.77083 2.1875C9.77083 1.94588 9.57496 1.75 9.33333 1.75H4.66667C4.42504 1.75 4.22917 1.94588 4.22917 2.1875C4.22917 2.42912 4.42504 2.625 4.66667 2.625ZM6.12499 6.26396V2.625H7.87499V6.26396C7.87499 6.62849 7.96608 6.98723 8.14 7.3076L8.60635 8.16667H5.39362L5.85997 7.3076C6.03389 6.98723 6.12499 6.62849 6.12499 6.26396ZM4.91862 9.04167H9.08135L10.2311 11.1596C10.2838 11.2567 10.2135 11.375 10.1029 11.375H3.89707C3.7865 11.375 3.71615 11.2567 3.7689 11.1596L4.91862 9.04167Z" fill="white"/></svg>
          Sandbox
        </span>
        <div class="sandbox-message">
          <span class="sandbox-text">You’re testing in Sandbox. Payments here are not real.</span>
          <a class="sandbox-link" target="_blank" rel="noopener" href="https://docs.zotlo.com/integrating-zotlo/sandbox-mode#test-payment-cards">View test cards</a>
        </div>
      </div>
    </header>
    <div id="zotlo-checkout" style="max-width: 460px; margin: 0 auto;"></div>
    <div id="app"></div>
    <div id="app2"></div>

    <!-- GLOBAL OBJECT USAGE-->
    <script src="./dist/zotlo-checkout.min.js"></script>
    <script src="./dist/zotlo-card.min.js"></script>
    <script src="https://unpkg.com/vue@3.5.15/dist/vue.global.prod.js"></script>
    <script src="./dist/integrations.js"></script>
    <script src="./dist/events.js"></script>
    <script src="./dist/cookiePopup.js"></script>
    <script src="./dist/toaster.js"></script>
    <script>
      let checkout;

      ZotloCheckout({
        token: '123ASDASsqasdas=',
        packageId: 'zotlo-123',
        returnUrl: 'https://localhost:5173',
        language: 'en',
        subscriberId: '',
        events: {
          onLoad(config) {
            // Set background color
            document.body.style.backgroundColor = (
              config.backgroundColor ||
              window.getComputedStyle(document.body).backgroundColor
            );

            if (config.sandbox) {
              const strip = document.getElementById('sandbox-strip');
              if (strip) strip.style.display = 'flex';
            }

            if (!window.Integration) return;

            window.checkConsent(config.cookieText, config.countryCode, config.packageId);

            // Load itegrations
            const Integration = window.Integration || {};
            Integration.debug = config.sandbox;

            const headScripts = Integration.init(config.countryCode, config.integrations);
            Integration.loadScripts(headScripts.script || []);

            // Load integration events
            window.EventActions.payment.loadGTMClickEvents(config.packageId);
          },
          onSuccess(result) {
            if (!window.EventActions) return;
            setTimeout(() => {
              window.EventActions.success.complete(result);
            }, 0);
          },
          onFail(error) {
            const message = error.message || 'An error occurred during payment processing';
            window.VueApp.addToaster('Error', message);
            window.EventActions.payment.paymentGTMError(message);
          },
          onOfferFail(error) {
            const message = error.message || 'Post payment offer failed to process';
            window.VueApp.addToaster('Error', message);
          },
          onInvalidForm(error) {
            const message = error.result.errors[0] || 'Unknown error';
            const formattedMessage = error.name ? `${error.name} - ${message}` : message;
            window.EventActions.payment.paymentGTMError(formattedMessage);
          },
          onError(error) {
            console.log('An error occured', error);
          }
        }
      }).then((zcInstance) => {
        checkout = zcInstance;
        checkout.mount('zotlo-checkout')
      });
    </script>
  </body>
</html>
