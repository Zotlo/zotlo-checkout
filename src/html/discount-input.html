<div class="zotlo-checkout__discount-content" data-discount-content="false">

  <div class="zotlo-checkout__discount-content__toggle-container">
    <button type="button" data-discount-toggle>{{TOGGLE_TEXT}}</button>
  </div>

  <div class="zotlo-checkout__discount-content__input-container">
    <div class="zotlo-checkout__input">
      <input type="text" name="discountCode" placeholder="{{INPUT_PLACEHOLDER}}" />
      <button type="button" data-discount-action="cancel">
        <span data-discount-action-span>{{CANCEL_TEXT}}</span>
        <div class="zotlo-checkout__loader zotlo-checkout__loader--mini"></div>
      </button>
    </div>
    <span class="zotlo-checkout__hint error" data-discount-error></span>
  </div>
</div>
